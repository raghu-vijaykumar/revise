t="700">Send comment to AI</text><rect x="744" y="668" width="977" height="152" rx="8" fill="#2b303d" stroke="#596c88"/><rect x="744" y="668" width="5" height="152" rx="3" fill="#7aa9ff"/><text x="762" y="693" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#7aa9ff" font-weight="700">PROPOSED EDIT 2  ·  VIDEO CAPTION</text><rect x="1598" y="678" width="29" height="28" rx="6" fill="#343b43"/><line x1="1606" y1="692" x2="1610" y2="697" stroke="#7ad4a5" stroke-width="2"/><line x1="1610" y1="697" x2="1619" y2="687" stroke="#7ad4a5" stroke-width="2"/><rect x="1633" y="678" width="29" height="28" rx="6" fill="#343b43"/><line x1="1642" y1="687" x2="1653" y2="698" stroke="#e99a9b" stroke-width="2"/><line x1="1653" y1="687" x2="1642" y2="698" stroke="#e99a9b" stroke-width="2"/><rect x="1668" y="678" width="29" height="28" rx="6" fill="#343b43"/><rect x="1675" y="685" width="15" height="11" rx="3" fill="#343b43" stroke="#7aa9ff"/><line x1="1678" y1="696" x2="1677" y2="699" stroke="#7aa9ff" stroke-width="2"/><text x="765" y="740" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#e4e7ed">The highlighted arc is the only range reassigned when E appears.</text><text x="765" y="794" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#a1a8b3">Linked to video at 04:18  ·  Directly editable</text><rect x="1496" y="575" width="203" height="43" rx="4" fill="#2b2d39"/>
