f" font-size="13" fill="#a1a8b3">2 proposed edits  ·  Your edits to this proposal remain pending until accepted</text><rect x="744" y="200" width="977" height="43" rx="6" fill="#242831" stroke="#363a43"/><text x="759" y="224" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e4e7ed">Paragraph  v</text><line x1="880" y1="207" x2="880" y2="236" stroke="#363a43" stroke-width="1"/><text x="899" y="224" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e4e7ed">H1</text><text x="945" y="224" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e4e7ed">H2</text><text x="1000" y="224" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e4e7ed" font-weight="700">B</text><text x="1040" y="224" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e4e7ed">I</text><text x="1080" y="224" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e4e7ed">U</text><text x="1132" y="224" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e4e7ed">• List</text><text x="1214" y="224" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e4e7ed">1. List</text><text x="1304" y="224" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e4e7ed">Link</text><text x="1378" y="224" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e4e7ed">Media</text><text x="1458" y="224" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e4e7ed">Undo</text><text x="1528" y="224" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e4e7ed">Redo</text><rect x="744" y="265" width="977" height="204" rx="8" fill="#23332f" stroke="#47866e"/><rect x="744" y="265" width="5" height="204" rx="3" fill="#7ad4a5"/><text x="762" y="290" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#7ad4a5" font-weight="700">PROPOSED EDIT 1  ·  REWRITE</text><rect x="1598" y="275" width="29" height="28" rx="6" fill="#343b43"/><line x1="1606" y1="289" x2="1610" y2="294" stroke="#7ad4a5" stroke-width="2"/><line x1