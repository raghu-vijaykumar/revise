<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="980" viewBox="0 0 1760 980" role="img" aria-label="Choose parent content folder and create separate workspaces">
  <title>Choose content folder and create workspaces</title>
  <rect width="1760" height="980" fill="#17191d"/>
  <rect width="1760" height="40" fill="#14161a"/>
  <text x="16" y="29" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#7aa9ff">N</text>
  <text x="51" y="25" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#a1a8b3">Workspace     Edit     Insert     View     Help</text>
  <text x="818" y="25" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#e4e7ed">Set up workspaces</text>
  <rect x="0" y="40" width="46" height="914" fill="#14161a"/>
  <text x="16" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#7aa9ff">S</text>
  <rect x="46" y="40" width="287" height="914" fill="#1b1d23"/>
  <text x="61" y="66" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#e4e7ed">WORKSPACES</text>
  <line x1="46" y1="83" x2="333" y2="83" stroke="#363a43"/>
  <text x="62" y="115" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a1a8b3">Content folder selected</text>
  <text x="62" y="158" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#747d8c">Sections appear here after setup.</text>
  <line x1="46" y1="829" x2="333" y2="829" stroke="#363a43"/>
  <text x="61" y="850" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#a1a8b3">&gt;  OUTLINE</text>
  <line x1="46" y1="866" x2="333" y2="866" stroke="#363a43"/>
  <text x="61" y="887" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#a1a8b3">&gt;  TIMELINE</text>
  <rect x="333" y="40" width="382" height="914" fill="#202329"/>
  <text x="352" y="66" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#e4e7ed">AI CHAT</text>
  <line x1="333" y1="83" x2="715" y2="83" stroke="#363a43"/>
  <text x="352" y="116" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a1a8b3">Choose a workspace to begin.</text>
  <rect x="715" y="40" width="1045" height="914" fill="#17191d"/>
  <rect x="715" y="40" width="1045" height="44" fill="#202329"/>
  <rect x="715" y="40" width="208" height="3" fill="#7aa9ff"/>
  <text x="731" y="67" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e4e7ed">Set up workspaces</text>
  <text x="900" y="67" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a1a8b3">×</text>
  <line x1="715" y1="84" x2="1760" y2="84" stroke="#363a43"/>
  <text x="779" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#e4e7ed">Choose where your workspaces live</text>
  <text x="780" y="180" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#a1a8b3">Select one parent folder. Every workspace gets its own subfolder there.</text>
  <rect x="780" y="220" width="911" height="118" rx="8" fill="#242831" stroke="#46505f"/>
  <text x="803" y="250" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#a1a8b3">CONTENT FOLDER</text>
  <text x="803" y="291" font-family="Consolas,monospace" font-size="18" fill="#e4e7ed">D:\Learning Notes</text>
  <rect x="1494" y="266" width="170" height="44" rx="6" fill="#295a9d"/>
  <text x="1510" y="294" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Choose folder…</text>
  <text x="781" y="385" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#e4e7ed">Your workspaces</text>
  <text x="781" y="411" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a1a8b3">Subject names in the app; separate folders on your computer.</text>
  <rect x="780" y="443" width="911" height="76" rx="7" fill="#242831" stroke="#363a43"/>
  <text x="807" y="474" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#e4e7ed">Physics</text>
  <text x="807" y="499" font-family="Consolas,monospace" font-size="13" fill="#a1a8b3">D:\Learning Notes\Physics\</text>
  <text x="1610" y="482" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#7aa9ff">Open  →</text>
  <rect x="780" y="531" width="911" height="76" rx="7" fill="#242831" stroke="#363a43"/>
  <text x="807" y="562" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#e4e7ed">Biology</text>
  <text x="807" y="587" font-family="Consolas,monospace" font-size="13" fill="#a1a8b3">D:\Learning Notes\Biology\</text>
  <text x="1610" y="570" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#7aa9ff">Open  →</text>
  <rect x="780" y="632" width="205" height="43" rx="6" fill="#343944"/>
  <text x="798" y="659" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e4e7ed">+  New workspace</text>
  <text x="781" y="732" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a1a8b3">Each space keeps its own sections, assets, AI chat, search, and history.</text>
  <text x="781" y="756" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a1a8b3">If this folder moves, the app asks you to locate it again.</text>
  <rect x="0" y="954" width="1760" height="26" fill="#263e62"/>
  <text x="14" y="971" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#e4e7ed">Set up workspaces</text>
</svg>
