#28496f"/><text x="99" y="211" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#e4e7ed" font-weight="700">Why keys move</text><text x="99" y="243" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#a1a8b3">Virtual nodes</text><text x="99" y="275" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#a1a8b3">Failure cases</text><text x="82" y="318" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#a1a8b3">v  Load Balancing</text><text x="65" y="360" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#a1a8b3">&gt;  Algorithms</text><text x="65" y="392" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#a1a8b3">&gt;  Research notes</text><text x="63" y="456" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#7aa9ff">+  New section</text><line x1="46" y1="829" x2="333" y2="829" stroke="#363a43" stroke-width="1"/><text x="61" y="850" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#e4e7ed" font-weight="700">&gt;  OUTLINE</text><line x1="46" y1="866" x2="333" y2="866" stroke="#363a43" stroke-width="1"/><text x="61" y="887" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#e4e7ed" font-weight="700">&gt;  TIMELINE  ·  Why keys move</text><rect x="333" y="40" width="382" height="914" rx="0" fill="#202329"/><line x1="715" y1="40" x2="715" y2="954" stroke="#363a43" stroke-width="1"/><text x="352" y="66" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#e4e7ed" font-weight="700">AI CHAT</text><text x="663" y="66" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#a1a8b3">...</text><line x1="333" y1="83" x2="715" y2="83" stroke="#363a43" stroke-width="1"/><text x="352" y="114" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#67d4c7">Working on: Why keys move</text><rect x="348" y="138" width="350" height="99" rx="7" fill="#2c3038"/><text x="363" y="163" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#a1a8b3" font-weight="700">YOU</text><text x="363" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e4e7ed">Improve the ring explanation and</text><text x="363" y="212" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e4e7ed">keep the video example.</text><rect x="348" y="252" width="350" height="190" rx="7" fill="#25323b"/><text x="363" y="277" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#67d4c7" font-weight="700">ASSISTANT</text><text x="363" y="308" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e4e7ed">I updated the selected passage and</text><text x="363" y="331" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e4e7ed">kept the video in this section.</text><text x="363" y="354" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e4e7ed">You can edit my proposal before</text><text x="363" y="377" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e4e7ed">accepting it.</text><rect x="363" y="393" width="320" height="33" rx="5" fill="#1a2939"/><text x="375" y="412" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#7aa9ff">2 changes  ·  Open Changes</text><line x1="333" y1="805" x2="715" y2="805" stroke="#363a43" stroke-width="1"/><rect x="349" y="820" width="349" height="91" rx="7" fill="#2b3038" stroke="#505866"/><text x="363" y="848" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a1a8b3">Ask about this section...</text><text x="363" y="888" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#a1a8b3">Dictate</text><text x="641" y="888" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#7aa9ff" font-weight="700">Send  &gt;</text><text x="351" y="933" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#a1a8b3">Context: selected section  ·  Review before applying</text><rect x="715" y="40" width="1045" height="914" rx="0" fill="#17191d"/><rect x="0" y="954" width="1760" height="26" rx="0" fill="#263e62"/><text x="14" y="970" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#e4e7ed">Local workspace   ·   Saved</text><text x="1584" y="970" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#e4e7ed">Rich editor</text><rect x="715" y="40" width="1045" height="44" rx="0" fill="#202329"/><text x="729" y="66" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a1a8b3">Why keys move</text><text x="859" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a1a8b3">x</text><line x1="881" y1="40" x2="881" y2="84" stroke="#363a43" stroke-width="1"/><text x="895" y="66" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a1a8b3">Virtual nodes</text><text x="1025" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a1a8b3">x</text><line x1="1047" y1="40" x2="1047" y2="84" stroke="#363a43" stroke-width="1"/><text x="1061" y="66" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a1a8b3">Research Browser</text><text x="1191" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a1a8b3">x</text><line x1="1213" y1="40" x2="1213" y2="84" stroke="#363a43" stroke-width="1"/><rect x="1213" y="40" width="166" height="44" rx="0" fill="#17191d"/><rect x="1213" y="40" width="166" height="2" rx="0" fill="#7aa9ff"/><text x="1227" y="66" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#e4e7ed">Settings</text><text x="1357" y="65" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a1a8b3">x</text><line x1="1379" y1="40" x2="1379" y2="84" stroke="#363a43" stroke-width="1"/><line x1="715" y1="84" x2="1760" y2="84" stroke="#363a43" stroke-width="1"/><text x="744" y="113" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#a1a8b3">Workspace  /  Settings</text><text x="744" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="26" fill="#e4e7ed" font-weight="700">Settings</text><text x="746" y="182" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#a1a8b3">Local-first defaults</text><rect x="744" y="217" width="977" height="120" rx="8" fill="#242831" stroke="#363a43"/><text x="763" y="248" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#e4e7ed" font-weight="700">AI provider</text><text x="763" y="280" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a1a8b3">Cloud requests show the selected section and sources before Send.</text><text x="763" y="305" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a1a8b3">Credentials stay in the operating system vault.</text><rect x="744" y="365" width="977" height="120" rx="8" fill="#242831" stroke="#363a43"/><text x="763" y="396" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#e4e7ed" font-weight="700">Rich editor</text><text x="763" y="428" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a1a8b3">Type and format directly; headings, lists, paste, and inline video.</text><text x="763" y="453" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a1a8b3">Changes are saved locally in a portable format.</text><rect x="744" y="513" width="977" height="120" rx="8" fill="#242831" stroke="#363a43"/><text x="763" y="544" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#e4e7ed" font-weight="700">Review and comments</text><text x="763" y="576" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a1a8b3">Every AI change is proposed until accepted.</text><text x="763" y="601" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a1a8b3">Comments and selection requests stay anchored to section revisions.</text><rect x="744" y="661" width="977" height="120" rx="8" fill="#242831" stroke="#363a43"/><text x="763" y="692" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#e4e7ed" font-weight="700">Privacy and capture</text><text x="763" y="724" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a1a8b3">Research capture is off by default.</text><text x="763" y="749" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a1a8b3">Learning from private content is off by default.</text><rect x="54" y="91" width="273" height="40" rx="5" fill="#242831" stroke="#46505f"/><text x="67" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#e4e7ed">Learning Vault</text><text x="300" y="117" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#a1a8b3">v</text></svg>