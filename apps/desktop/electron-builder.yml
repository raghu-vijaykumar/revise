appId: com.revise.desktop
productName: Revise
directories:
  output: release
files:
  - dist/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
  createDesktopShortcut: false
